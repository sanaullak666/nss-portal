<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <title>Registration · Responsive Form</title>
  <!-- Font Awesome 6 (free) for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ==========================================================================
       1. GLOBAL RESET & BASE SETTINGS
       ========================================================================== */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }

    body {
      background: #f4f7fc;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh; /* Dynamic viewport height for mobile browser URL bars */
      overflow-x: hidden;
      color: #1e2f44;
    }

    /* ==========================================================================
       2. HEADER / LOGO / THEME (PRESERVED EXACTLY AS PROVIDED)
       ========================================================================== */
    .main-header {
      background: linear-gradient(135deg, #0b2b4f 0%, #123b6b 100%);
      padding: 1rem 2.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      position: relative;
      z-index: 10;
      width: 100%;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      font-size: 2rem;
      color: #ffc107;
      background: #ffffff1a;
      padding: 10px;
      border-radius: 14px;
      line-height: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon i {
      font-size: 1.6rem;
    }

    .logo-text {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: white;
    }

    .logo-text span {
      color: #ffc107;
      font-weight: 800;
    }

    .theme-tag {
      background: rgba(255, 255, 255, 0.12);
      padding: 0.5rem 1.2rem;
      border-radius: 40px;
      color: #e0e9f5;
      font-size: 0.9rem;
      font-weight: 500;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      white-space: nowrap;
    }

    /* ==========================================================================
       3. FLUID & RESPONSIVE REGISTRATION FORM SECTION
       ========================================================================== */
    .registration-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      /* Fluid padding using clamp: min 1rem on small screens, scaling up to 3rem */
      padding: clamp(1.2rem, 3.5vw, 3rem) clamp(0.75rem, 3vw, 2rem);
      background: radial-gradient(circle at 10% 30%, #eef4fe, #f4f7fc 90%);
      box-sizing: border-box;
    }

    /* Registration Card: Fluid sizing with clamp and min() to eliminate overflow */
    .registration-card {
      background: #ffffff;
      width: 100%;
      max-width: min(560px, 100%);
      margin: 0 auto;
      border-radius: clamp(20px, 4vw, 36px);
      padding: clamp(1.5rem, 4.5vw, 2.8rem) clamp(1.15rem, 4vw, 2.5rem);
      box-shadow: 0 clamp(14px, 3vw, 25px) clamp(28px, 6vw, 50px) -10px rgba(0, 20, 50, 0.25),
                  0 0 0 1px rgba(255, 255, 255, 0.7) inset;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-sizing: border-box;
    }

    .registration-card:hover {
      box-shadow: 0 30px 60px -12px rgba(0, 20, 50, 0.3);
    }

    /* Form Header */
    .form-header {
      text-align: center;
      margin-bottom: clamp(1.25rem, 3.5vw, 2.2rem);
    }

    .form-header h2 {
      font-size: clamp(1.45rem, 4.2vw, 2.1rem);
      font-weight: 700;
      color: #0b2b4f;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
      line-height: 1.25;
      word-break: break-word;
    }

    .form-header p {
      color: #5b6f8c;
      font-size: clamp(0.85rem, 2vw, 1rem);
      font-weight: 400;
      line-height: 1.45;
    }

    /* Form Input Groups */
    .input-group {
      margin-bottom: clamp(0.85rem, 2.4vw, 1.4rem);
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .input-group label {
      font-size: clamp(0.84rem, 1.8vw, 0.92rem);
      font-weight: 600;
      color: #1e2f44;
      margin-bottom: clamp(0.3rem, 0.8vw, 0.45rem);
      letter-spacing: 0.01em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .input-group label i {
      color: #1e4a7a;
      font-size: clamp(0.85rem, 1.8vw, 0.95rem);
      width: 18px;
      flex-shrink: 0;
      text-align: center;
    }

    /* Inputs with touch-friendly minimum target size (min 46px) */
    .input-group input {
      width: 100%;
      min-height: 46px;
      padding: clamp(0.7rem, 1.8vw, 0.95rem) clamp(0.9rem, 2.4vw, 1.2rem);
      font-size: clamp(0.92rem, 2vw, 1rem);
      border: 1.5px solid #d9e2ef;
      border-radius: clamp(12px, 2.5vw, 18px);
      background: #fbfdff;
      color: #0b1e2e;
      outline: none;
      transition: all 0.2s ease;
      font-weight: 500;
      box-sizing: border-box;
      -webkit-appearance: none;
      appearance: none;
    }

    .input-group input::placeholder {
      color: #9aafc9;
      font-weight: 400;
      font-size: clamp(0.85rem, 1.9vw, 0.95rem);
    }

    .input-group input:focus {
      border-color: #1e4a7a;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(30, 74, 122, 0.12);
    }

    /* Accessible Password Hint */
    .password-hint {
      font-size: clamp(0.75rem, 1.7vw, 0.82rem);
      color: #6b7f99;
      margin-top: 0.35rem;
      display: flex;
      align-items: flex-start;
      gap: 6px;
      line-height: 1.4;
    }

    .password-hint i {
      color: #ffc107;
      font-size: 0.72rem;
      margin-top: 3px;
      flex-shrink: 0;
    }

    /* Terms & Conditions Checkbox (Clean wrap, touch target min 44px equivalent) */
    .terms-check {
      display: flex;
      align-items: flex-start;
      gap: clamp(8px, 2vw, 12px);
      margin: clamp(1.1rem, 2.8vw, 1.8rem) 0;
      width: 100%;
      cursor: pointer;
    }

    .terms-check input[type="checkbox"] {
      width: 20px;
      height: 20px;
      min-width: 20px;
      min-height: 20px;
      accent-color: #0b2b4f;
      border-radius: 6px;
      margin-top: 2px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .terms-check label {
      font-size: clamp(0.82rem, 1.8vw, 0.9rem);
      color: #2c4058;
      line-height: 1.45;
      cursor: pointer;
      font-weight: 500;
      word-break: break-word;
    }

    .terms-check a {
      color: #0b2b4f;
      font-weight: 700;
      text-decoration: none;
      border-bottom: 1.5px solid rgba(11, 43, 79, 0.2);
      transition: border-color 0.2s;
    }

    .terms-check a:hover {
      border-bottom-color: #0b2b4f;
    }

    /* Primary Register Button with 48px+ touch target */
    .register-btn {
      width: 100%;
      min-height: 48px;
      background: #0b2b4f;
      border: none;
      padding: clamp(0.85rem, 2.2vw, 1.1rem) clamp(1.2rem, 3vw, 1.5rem);
      border-radius: 40px;
      font-size: clamp(0.95rem, 2.2vw, 1.15rem);
      font-weight: 700;
      color: white;
      letter-spacing: 0.3px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 12px 25px -8px rgba(11, 43, 79, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    .register-btn i {
      font-size: clamp(0.95rem, 2vw, 1.1rem);
      color: #ffc107;
      flex-shrink: 0;
    }

    .register-btn:hover {
      background: #123b6b;
      box-shadow: 0 18px 30px -8px rgba(11, 43, 79, 0.45);
    }

    .register-btn:active {
      transform: scale(0.98);
    }

    /* Login Redirect */
    .login-redirect {
      text-align: center;
      margin-top: clamp(1.1rem, 2.8vw, 1.8rem);
      font-size: clamp(0.82rem, 1.8vw, 0.95rem);
      color: #4d627c;
      font-weight: 500;
      line-height: 1.4;
    }

    .login-redirect a {
      color: #0b2b4f;
      font-weight: 700;
      text-decoration: none;
      margin-left: 6px;
      border-bottom: 1.5px solid rgba(11, 43, 79, 0.25);
      transition: border 0.2s;
      display: inline-block;
    }

    .login-redirect a:hover {
      border-bottom-color: #0b2b4f;
    }

    /* ==========================================================================
       4. BREAKPOINTS & ADAPTIVE STYLING
       ========================================================================== */

    /* [A] Extra Small Phones (<= 360px) - e.g. iPhone SE 1st Gen, Galaxy A-series */
    @media (max-width: 360px) {
      .registration-container {
        padding: 0.8rem 0.5rem;
      }

      .registration-card {
        padding: 1.4rem 0.9rem;
        border-radius: 18px;
        box-shadow: 0 10px 25px rgba(0, 20, 50, 0.15);
      }

      .form-header h2 {
        font-size: 1.35rem;
      }

      .input-group input {
        padding: 0.65rem 0.85rem;
        min-height: 44px;
      }

      .register-btn {
        padding: 0.75rem 1rem;
        min-height: 44px;
        font-size: 0.95rem;
      }

      .main-header {
        padding: 0.75rem 1rem;
      }

      .logo-text {
        font-size: 1.3rem;
      }

      .logo-icon {
        padding: 6px;
        font-size: 1.4rem;
      }

      .theme-tag {
        font-size: 0.7rem;
        padding: 0.35rem 0.75rem;
      }
    }

    /* [B] Small Devices / Large Phones (361px to 480px) - e.g. iPhone 14/15 Pro Max */
    @media (min-width: 361px) and (max-width: 480px) {
      .registration-card {
        padding: 1.75rem 1.25rem;
        border-radius: 22px;
      }

      .main-header {
        padding: 0.85rem 1.25rem;
      }

      .logo-text {
        font-size: 1.45rem;
      }
    }

    /* [C] Medium Devices / Tablets Portrait (481px to 768px) - e.g. iPad Mini */
    @media (min-width: 481px) and (max-width: 768px) {
      .registration-card {
        padding: 2.2rem 1.8rem;
        border-radius: 28px;
      }

      .main-header {
        padding: 1rem 1.75rem;
      }
    }

    /* [D] Large Devices / Tablets Landscape & Laptops (769px to 1024px) */
    @media (min-width: 769px) and (max-width: 1024px) {
      .registration-card {
        padding: 2.5rem 2.2rem;
      }
    }

    /* [E] Extra Large Desktops (1025px to 1440px) */
    @media (min-width: 1025px) and (max-width: 1440px) {
      .registration-container {
        padding: 3rem 2rem;
      }
    }

    /* [F] Ultra-Wide / 4K Displays (1441px+) */
    @media (min-width: 1441px) {
      .registration-container {
        padding: 4rem 2rem;
      }

      .registration-card {
        max-width: 600px;
        padding: 3.2rem 2.8rem;
      }
    }

    /* ==========================================================================
       5. ORIENTATION & SHORT-SCREEN SUPPORT (Mobile Landscape)
       Prevents awkward excessive vertical scrolling on landscape phones & tablets
       ========================================================================== */
    @media (max-height: 550px) and (orientation: landscape) {
      .main-header {
        padding: 0.5rem 1.5rem;
      }

      .logo-text {
        font-size: 1.3rem;
      }

      .registration-container {
        padding: 1rem 1rem;
        align-items: flex-start;
      }

      .registration-card {
        padding: 1.25rem 1.5rem;
        border-radius: 20px;
      }

      .form-header {
        margin-bottom: 0.9rem;
      }

      .form-header h2 {
        font-size: 1.35rem;
      }

      .form-header p {
        font-size: 0.85rem;
      }

      .input-group {
        margin-bottom: 0.75rem;
      }

      .input-group input {
        min-height: 40px;
        padding: 0.5rem 0.85rem;
      }

      .terms-check {
        margin: 0.9rem 0;
      }

      .register-btn {
        min-height: 42px;
        padding: 0.65rem 1rem;
      }

      .login-redirect {
        margin-top: 0.9rem;
      }
    }

    /* ==========================================================================
       6. ACCESSIBILITY ENHANCEMENTS
       ========================================================================== */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }

    :focus-visible {
      outline: 2px solid #0b2b4f;
      outline-offset: 2px;
    }
  </style>
</head>
<body>

  <!-- ========== HEADER (Theme, Logo & Branding Preserved Exactly) ========== -->
  <header class="main-header">
    <div class="logo-area">
      <div class="logo-icon">
        <i class="fas fa-cube"></i>
      </div>
      <div class="logo-text">
        Tech<span>Nest</span>
      </div>
    </div>
    <div class="theme-tag">
      <i class="fas fa-paint-brush" style="margin-right: 6px;"></i> Theme · Indigo
    </div>
  </header>

  <!-- ========== MAIN CONTENT - FULLY FLUID & RESPONSIVE REGISTRATION CARD ========== -->
  <div class="registration-container">
    <div class="registration-card">
      
      <!-- Form Header -->
      <div class="form-header">
        <h2>Create account</h2>
        <p>Join our community in less than a minute</p>
      </div>

      <!-- Registration Form (UI Only - All Form Actions & Logic Untouched) -->
      <form onsubmit="event.preventDefault(); /* UI only */">
        
        <!-- Full Name Field -->
        <div class="input-group">
          <label for="fullName"><i class="fas fa-user"></i> Full name</label>
          <input type="text" id="fullName" placeholder="e.g. Alex Morgan" autocomplete="name" required>
        </div>

        <!-- Email Field -->
        <div class="input-group">
          <label for="email"><i class="fas fa-envelope"></i> Email address</label>
          <input type="email" id="email" placeholder="hello@example.com" autocomplete="email" required>
        </div>

        <!-- Password Field with Hint -->
        <div class="input-group">
          <label for="password"><i class="fas fa-lock"></i> Password</label>
          <input type="password" id="password" placeholder="Create a strong password" autocomplete="new-password" required>
          <div class="password-hint">
            <i class="fas fa-circle-info"></i> Use 8+ characters with a mix of letters & numbers
          </div>
        </div>

        <!-- Confirm Password Field -->
        <div class="input-group">
          <label for="confirmPassword"><i class="fas fa-check-circle"></i> Confirm password</label>
          <input type="password" id="confirmPassword" placeholder="Re-enter your password" autocomplete="off" required>
        </div>

        <!-- Terms & Conditions Checkbox -->
        <div class="terms-check">
          <input type="checkbox" id="termsCheckbox" required>
          <label for="termsCheckbox">
            I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
          </label>
        </div>

        <!-- Register Button (Accessible min 48px Tap Target) -->
        <button type="submit" class="register-btn">
          <i class="fas fa-user-plus"></i> Register now
        </button>

        <!-- Login Redirect Link -->
        <div class="login-redirect">
          Already have an account? <a href="#">Sign in</a>
        </div>

      </form>
    </div>
  </div>

</body>
</html>
